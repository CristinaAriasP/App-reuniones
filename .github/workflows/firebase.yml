# Publica la app en Firebase Hosting (y sube las reglas de seguridad de Firestore)
# cada vez que se suben cambios (rama main o la rama de trabajo actual), o a mano desde la pestaña «Actions» de GitHub.
#
# Necesita un secreto en GitHub: Settings → Secrets and variables → Actions → FIREBASE_SERVICE_ACCOUNT
# (el contenido del archivo JSON de la cuenta de servicio; ver docs/FIREBASE.md).
name: Publicar en Firebase

on:
  push:
    branches: [main, claude/meeting-management-app-p6upip]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Comprobar que existe el secreto
        id: secret
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          # Mientras no esté configurada la llave, no se publica (pero tampoco se marca como error)
          if [ -z "$SA" ]; then
            # Lanzado a mano: error visible. Lanzado por un cambio: se omite sin marcar error.
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::No se ha publicado: falta el secreto FIREBASE_SERVICE_ACCOUNT en GitHub (Settings → Secrets and variables → Actions). Ver docs/FIREBASE.md"
              exit 1
            fi
            echo "::warning::Aún no está el secreto FIREBASE_SERVICE_ACCOUNT: no se publica (ver docs/FIREBASE.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publicar
        if: steps.secret.outputs.ready == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx firebase deploy --only hosting,firestore:rules --project agenda-de-proyectos --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
